<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Coding the Game</title>
    <style>
      body {
        background: #111;
        color: #fff;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      .topbar {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .level {
        border: 1px solid #fff;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .status-group {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 30px;
      }

      .pointer {
        width: 30px;
        text-align: center;
        margin-bottom: 5px;
        transform: translateX(0px);
      }

      .row {
        display: flex;
        gap: 5px;
      }

      .bit {
        width: 30px;
        height: 30px;
        border: 1px solid #777;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      #bits.running .bit {
        border-color: #444;
      }

      .btn {
        margin: 20px 0;
        width: 40px;
        height: 40px;
        font-size: 18px;
        cursor: pointer;
      }

      .cell {
        width: 40px;
        height: 40px;
        border: 1px solid #444;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .result {
        font-size: 30px;
        height: 30px;
        display: flex;
        align-items: center;
      }

      .next-level-btn {
        display: none;
        min-width: 44px;
        height: 30px;
        border: 1px solid #666;
        border-radius: 4px;
        background: #222;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        padding: 0 8px;
      }

      .next-level-btn.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="level">1</div>
      <div class="status-group">
        <div class="result" id="result"></div>
        <button class="next-level-btn" id="nextLevelBtn" type="button">
          Next
        </button>
      </div>
    </div>

    <div>
      <div class="pointer" id="pointer">▼</div>
      <div class="row" id="bits"></div>
    </div>

    <button class="btn" id="btn" onclick="onActionClick()">▶</button>

    <div class="row" id="world" style="user-select: none"></div>

    <script>
      const NUM_BITS = 8;
      const GRID_SIZE = 9;
      const START_POS = 4;
      const PIZZAS = [2, 8];
      let bits = [1, 1, 1, 1, 0, 0, 0, 0];
      let playerPos = START_POS;
      let pizzasLeft = [...PIZZAS];
      let isRunning = false;

      const bitsEl = document.getElementById("bits");
      const worldEl = document.getElementById("world");
      const pointerEl = document.getElementById("pointer");
      const resultEl = document.getElementById("result");
      const btnEl = document.getElementById("btn");
      const nextLevelBtn = document.getElementById("nextLevelBtn");

      function updateBits() {
        bitsEl.innerHTML = "";
        bits.forEach((val, idx) => {
          const d = document.createElement("div");
          d.className = "bit";
          d.innerText = val;
          d.onclick = () => {
            if (isRunning) return;
            bits[idx] = bits[idx] === 0 ? 1 : 0;
            resultEl.innerText = "";
            updateBits();
          };
          bitsEl.appendChild(d);
        });
      }

      function updatePointerToBit(idx) {
        requestAnimationFrame(() => {
          const bitEl = bitsEl.children[idx];
          if (!bitEl) return;

          const bitRect = bitEl.getBoundingClientRect();
          const bitsRect = bitsEl.getBoundingClientRect();
          const offsetX =
            bitRect.left -
            bitsRect.left +
            (bitRect.width - pointerEl.offsetWidth) / 2;

          pointerEl.style.transform = `translateX(${offsetX}px)`;
        });
      }

      function updateWorld() {
        worldEl.innerHTML = "";
        for (let i = 0; i < GRID_SIZE; i++) {
          const d = document.createElement("div");
          d.className = "cell";
          let txt = "";
          if (i === playerPos) txt += "🚶";
          if (pizzasLeft.includes(i) && i !== playerPos) txt += "🍕";
          d.innerText = txt;
          worldEl.appendChild(d);
        }
      }

      function resetState() {
        isRunning = false;
        playerPos = START_POS;
        pizzasLeft = [...PIZZAS];
        bitsEl.classList.remove("running");
        pointerEl.style.transform = "translateX(-100%)";
        btnEl.innerText = "▶";
        updateWorld();
      }

      function onActionClick() {
        if (isRunning) {
          resultEl.innerText = "";
          resetState();
        } else {
          simulate();
        }
      }

      async function simulate() {
        resetState();
        isRunning = true;
        bitsEl.classList.add("running");
        resultEl.innerText = "";
        btnEl.innerText = "◼";

        for (let ip = 0; ip < NUM_BITS; ip++) {
          updatePointerToBit(ip);

          playerPos =
            bits[ip] === 0
              ? Math.max(0, playerPos - 1)
              : Math.min(GRID_SIZE - 1, playerPos + 1);

          const pIdx = pizzasLeft.indexOf(playerPos);
          if (pIdx !== -1) pizzasLeft.splice(pIdx, 1);

          updateWorld();

          if (ip < NUM_BITS - 1) {
            await new Promise((r) => setTimeout(r, 400));
            if (!isRunning) {
              return;
            }
          }
        }

        btnEl.innerText = "↺";

        if (pizzasLeft.length === 0) {
          resultEl.innerText = "✅";
          nextLevelBtn.classList.add("visible");
        } else {
          resultEl.innerText = "❌";
        }
      }

      nextLevelBtn.addEventListener("click", () => {
        alert("No more levels yet :(");
      });

      updateBits();
      resetState();
    </script>
  </body>
</html>
