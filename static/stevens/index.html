  <head>

    <title>Stevens</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body,
      #canvas-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #8bd5e8;
        color: #173d47;
        font-family: system-ui, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #canvas-container,
      canvas {
        position: fixed;
        inset: 0;
      }

      canvas {
        display: block;
      }

      .controls {
        position: fixed;
        bottom: max(22px, env(safe-area-inset-bottom));
        left: 50%;
        z-index: 2;
        width: 160px;
        height: 160px;
        border: 1px solid #ffffffa8;
        border-radius: 29px;
        overflow: hidden;
        background: #173d4754;
        box-shadow: 0 3px 12px #17495826;
        transform: translateX(-50%);
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* the diagonal dividers between the four wedges */
      .controls::before,
      .controls::after {
        content: "";
        position: absolute;
        left: -21%;
        top: calc(50% - 1px);
        width: 142%;
        height: 2px;
        background: #ffffffa8;
        transform: rotate(45deg);
        pointer-events: none;
      }

      .controls::after {
        transform: rotate(-45deg);
      }

      .controls [data-action] {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      .controls [data-action].pressed {
        background: #173d47a3;
      }

      .controls svg {
        position: absolute;
      }

      [data-action="forward"] {
        clip-path: polygon(50% 50%, 0 0, 100% 0);
      }

      [data-action="right"] {
        clip-path: polygon(50% 50%, 100% 0, 100% 100%);
      }

      [data-action="back"] {
        clip-path: polygon(50% 50%, 100% 100%, 0 100%);
      }

      [data-action="left"] {
        clip-path: polygon(50% 50%, 0 100%, 0 0);
      }

      /* arrows are 30px, close to the pad edge */
      [data-action="forward"] svg { top: 18px; }
      [data-action="back"] svg { bottom: 18px; }
      [data-action="left"] svg { left: 18px; }
      [data-action="right"] svg { right: 18px; }

      .side-button {
        position: fixed;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border: 1px solid #ffffffa8;
        border-radius: 16px;
        background: #173d4754;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .side-button:active {
        background: #173d47a3;
      }

      .side-button:disabled {
        opacity: 0.3;
      }

      #undo {
        left: max(20px, env(safe-area-inset-left));
        bottom: max(22px, env(safe-area-inset-bottom));
      }

      #menu-button {
        right: max(20px, env(safe-area-inset-right));
        bottom: max(22px, env(safe-area-inset-bottom));
      }

      #redo {
        display: none;
        left: max(20px, env(safe-area-inset-left));
        bottom: calc(max(22px, env(safe-area-inset-bottom)) + 56px);
      }

      body.menu-open #redo {
        display: grid;
      }

      #menu {
        position: fixed;
        z-index: 2;
        display: none;
        flex-direction: column;
        gap: 6px;
        right: max(20px, env(safe-area-inset-right));
        bottom: calc(max(22px, env(safe-area-inset-bottom)) + 56px);
      }

      #menu.open {
        display: flex;
      }

      #menu button {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        padding: 0;
        border: 1px solid #ffffffa8;
        border-radius: 16px;
        background: #173d4754;
        -webkit-tap-highlight-color: transparent;
      }

      #menu button:active {
        background: #173d47d9;
      }

      #menu button:disabled {
        opacity: 0.3;
      }

      .toolbar,
      .level-bar {
        position: fixed;
        z-index: 2;
        display: none;
        gap: 6px;
        left: 50%;
        transform: translateX(-50%);
      }

      .level-bar {
        bottom: max(22px, env(safe-area-inset-bottom));
      }

      .toolbar {
        bottom: calc(max(22px, env(safe-area-inset-bottom)) + 52px);
      }

      .toolbar button,
      .level-bar button {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        padding: 0;
        border: 1px solid #ffffffa8;
        border-radius: 14px;
        background: #173d4754;
        -webkit-tap-highlight-color: transparent;
      }

      .toolbar button.active {
        background: #173d47d9;
        border-color: white;
      }

      #load-select {
        position: fixed;
        z-index: 1;
        left: 50%;
        bottom: max(22px, env(safe-area-inset-bottom));
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      body.editing .toolbar,
      body.editing .level-bar {
        display: flex;
      }

      body.editing .controls,
      body.editing #undo,
      body.editing #redo,
      body.editing #menu-button,
      body.editing #menu {
        display: none;
      }
    </style>
